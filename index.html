
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Intelligence | The Compounding Room</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #ffffff;
            font-family: Arial, sans-serif;
        }

        .poster-container {
            position: relative;
            width: 100%;
            max-width: 1088px;
            margin: 0 auto;
        }

        .poster {
            display: block;
            width: 100%;
            height: auto;
        }

        /* Clickable area over the blue button */
        .telegram-button {
            position: absolute;
            left: 12.6%;
            top: 73.3%;
            width: 75%;
            height: 9.5%;
            border-radius: 999px;
            cursor: pointer;
            display: block;
            -webkit-tap-highlight-color: transparent;
        }

        .telegram-button:focus-visible {
            outline: 3px solid #102d72;
            outline-offset: 3px;
        }
    </style>
</head>

<body>

    <main class="poster-container">

        <!-- Replace this path with your poster image -->
        <img
            src="poster.png"
            alt="Intelligence by The Compounding Room"
            class="poster"
        >

        <!-- Click the blue button to open Telegram -->
        <a
            href="https://t.me/GrowthCompounders"
            class="telegram-button"
            target="_blank"
            rel="noopener noreferrer"
            aria-label="Guide usage in group"
            title="Guide usage in group"
        ></a>

    </main>

</body>
</html>
